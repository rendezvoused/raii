<!DOCTYPE html>
<html lang="es">
<head>

  <link href="https://fonts.googleapis.com/css?family=Karla:400,700" rel="stylesheet" type="text/css">
  <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://static.tumblr.com/qudkd6d/OcDnl99gb/style.css" rel="stylesheet" type="text/css">

  <style>
    /*--------------------------------RESET----------------------------------*/
    html, body, div, span, applet, object, iframe,
    h1, h2, h3, h4, h5, h6, blockquote, pre,
    a, abbr, acronym, address, big, cite, code,
    del, dfn, em, img, ins, kbd, q, s, samp,
    small, strike, strong, sub, sup, tt, var,
    b, u, i, center,
    dl, dt, dd,
    fieldset, form, label, legend,
    table, caption, tbody, tfoot, thead, tr, th, td,
    article, aside, canvas, details, embed,
    figure, figcaption, footer, header, hgroup,
    menu, nav, output, ruby, section, summary,
    time, mark, audio, video {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
    }

    article, aside, details, figcaption, figure, footer, header, hgroup, main, nav, section, summary {
      display: block;
    }

    html, html a {
      -webkit-font-smoothing: antialiased;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      -webkit-box-sizing: border-box;
      -moz-box-sizing: border-box;
    }

    /*-------------------------------SIN DESPLAZAMIENTO----------------------------------*/
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin: 0;
      padding: 0;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    ::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    /*-------------------------CONTROLS----------------------*/
    iframe.tmblr-iframe {
      z-index: 99999999999999 !important;
      top: 10px !important;
      right: 15px !important;
      opacity: 0.4;
      transform: scale(0.6);
      transform-origin: 100% 0;
      transition: opacity 0.3s ease;
    }

    iframe.tmblr-iframe:hover {
      opacity: 0.7 !important;
    }

    /*-------------------------BLOCKQUOTE----------------------*/
    blockquote {
      padding-left: 12px;
      margin: 6px 0;
      border-left: 1px solid #32323a;
      color: #a1a1aa;
    }

    blockquote img {
      padding: 0;
      max-width: 100px !important;
      height: auto;
    }

    /*---------------------------BODY (CENTRADO Y NOCTURNO)-------------------------------------*/
    body {
      background-color: #0f0f11;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Source Sans Pro', sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      word-wrap: break-word;
      color: #b8b8c0;
      line-height: 1.4;
    }

    a,
    a:active,
    a:visited {
      color: #e4e4e7;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover {
      color: #8e8e98;
    }

    strong, b {
      font-weight: bold;
      color: #f4f4f5;
    }

    em, i, u {
      font-style: italic;
    }

    /*---------------------------MARKUP--------------------------------*/
    #wrapper {
      margin: 0 auto;
      max-width: 420px;
      width: 100%;
      transform-origin: center center;
    }

    header {
      width: 100%;
      margin: 0 auto 20px auto;
    }

    #entries {
      width: 100%;
      margin: 0 auto;
      position: relative;
    }

    /*---------------------------HEADER--------------------------------*/
    .header-content {
      text-align: center;
    }

    .header-content .main-title {
      width: 100%;
      position: relative;
    }

    .header-content .main-title .line {
      height: 1px;
      background-color: #27272e;
      width: 100%;
      position: absolute;
      top: 9px;
      z-index: 0;
    }

    .header-content .main-title a {
      position: relative;
      z-index: 1;
      font-family: 'Karla', sans-serif;
      font-size: 14px;
      display: inline-block;
      background: #0f0f11;
      padding: 0 16px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #e4e4e7;
    }

    .header-content .desc {
      color: #7e7e8a;
      display: block;
      max-width: 250px;
      margin: 8px auto 0 auto;
      font-size: 11px;
    }

    /*---Lightbox---*/
    .vignette {
      opacity: 0;
    }

    .tmblr-lightbox {
      background-color: rgba(10, 10, 12, 0.9) !important;
    }

    .tmblr-lightbox img {
      box-shadow: none !important;
      border-radius: 0 !important;
    }

    /*---------------------------------POST-----------------------------------*/
    #entries .post {
      margin: 0 auto;
      position: relative;
      min-height: 40px;
      background-color: #18181c;
      border-radius: 10px;
      padding: 16px;
      border: 1px solid #2a2a32;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      width: 100%;
    }

    .post-inner {
      position: relative;
      overflow: hidden;
      padding: 0;
      border-radius: 4px;
    }

    .photo-slideshow,
    .post .post-inner img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Bookmark superior derecho */
    .permalink-tag {
      font-size: 18px;
      text-align: center;
      position: absolute;
      top: -8px;
      right: 22px;
      width: 20px;
      z-index: 5;
    }

    .permalink-tag.photo a {
      color: #7e7e8a;
    }

    .permalink-tag.photo a:hover {
      color: #e4e4e7;
    }

    /* Contenedor de insignias debajo de las fotos a la derecha */
    .post-badges {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .reblog-source {
      font-family: 'Karla', sans-serif;
      font-size: 10px;
      line-height: 1;
      text-align: center;
      padding: 5px 10px;
      display: inline-block;
      color: #d4d4dc;
      border-radius: 5px;
      border: 1px solid #34343e;
      transition: all 0.3s ease;
    }

    .reblog-source.photo {
      background: #25252c;
    }

    .reblog-source.photo:hover {
      background: #32323c;
      color: #ffffff;
      border-color: #4a4a58;
    }

    /* Like & Reblog flotante sobre fotos */
    .like-and-reblog {
      font-size: 16px;
      text-align: center;
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 10;
    }

    .like-and-reblog .post-like,
    .like-and-reblog .post-reblog {
      margin: 0;
      padding: 0;
      display: block;
      height: 26px;
      width: 26px;
      background: rgba(24, 24, 28, 0.88);
      border: 1px solid #2e2e38;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: all 0.35s ease-out;
    }

    .like-and-reblog .post-like {
      padding: 2px 0 0 0;
      transform: translateX(40px);
    }

    .like-and-reblog .post-reblog {
      transform: translateX(80px);
      transition-delay: 0.15s;
      margin-bottom: 5px;
    }

    .post:hover .like-and-reblog .post-like,
    .post:hover .like-and-reblog .post-reblog {
      transform: translateX(0px);
      opacity: 1;
    }

    .post-like {
      position: relative;
      cursor: pointer;
    }

    .like_button {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 10;
    }

    .custom-like {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .custom-like i {
      font-size: 10px;
      color: #a1a1aa;
      width: 100%;
      transition: color 0.3s ease;
    }

    .like_button:hover + .custom-like i,
    .like_button.liked + .custom-like i {
      color: #ff879b;
    }

    .post-reblog i {
      font-size: 10px;
      color: #a1a1aa;
      transition: color 0.3s ease;
    }

    .post-reblog:hover i {
      color: #ffffff;
    }

    /* Caption */
    #entries .post-caption {
      position: relative;
    }

    .post .cap {
      max-width: 100%;
      padding: 12px 6px 4px 6px;
    }

    .post .cap p {
      margin-bottom: 4px;
    }

    /* Ajustes para pantallas pequeñas */
    @media (max-width: 400px) {
      body {
        padding: 12px;
      }

      header {
        margin-bottom: 14px;
      }

      #entries .post {
        padding: 12px;
      }
    }
  </style>
</head>

  <script>
    function fitToViewport() {
      var $wrapper = $('#wrapper');
      $wrapper.css('transform', 'none');
      var availableHeight = window.innerHeight - 24;
      var contentHeight = $wrapper.outerHeight(true);
      if (contentHeight > availableHeight && availableHeight > 0) {
        var scale = availableHeight / contentHeight;
        $wrapper.css('transform', 'scale(' + scale + ')');
      }
    }

    $(document).ready(function () {
      $('iframe.tumblr_audio_player').load(function () {
        $('iframe.tumblr_audio_player').contents().find("head")
          .append($("<style type='text/css'> .audio-player{background:!important;}.play-pause{color:#b8b8c0!important;}.progress {display:none !important;} </style>"));
      });

      var photosetOptions = {
        lightoox: true,
        rounded: false,
        gutter: 0,
        photoset: '.photo-slideshow',
        photoWrap: '.photo-data',
        photo: '.pxu-photo'
      };

      $('.photo-slideshow').pxuPhotoset(photosetOptions);

      fitToViewport();
      setTimeout(fitToViewport, 200);
    });

    $(window).on('load resize', fitToViewport);
  </script>
